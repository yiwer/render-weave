# 出图服务的本机环境（ADR-0017、M240、M259）：接口进程、一个 worker、PostgreSQL 与 S3 兼容存储（RustFS）。
# 凭据只经环境变量传入，放在不进版本库的 .env 里：第一次运行 node service/scripts/up.mjs 会生成它并起服务，
# 之后 docker compose up -d --build --wait 即可。Docker 后端测试：node service/scripts/test-docker.mjs。
name: renderweave

# 接口进程与 worker 用应用账号 renderweave_app 连库，行级安全对它生效；属主账号只给部署步骤 setup 执行迁移（M262）。
x-service-env: &service-env
  RW_DATABASE_URL: postgres://renderweave_app:${RW_APP_DB_PASSWORD:?缺少 RW_APP_DB_PASSWORD，先运行 node service/scripts/up.mjs 补全 .env}@postgres:5432/renderweave
  RW_S3_ENDPOINT: http://s3:9000
  RW_S3_BUCKET: renderweave
  RW_S3_ACCESS_KEY_ID: ${RW_S3_ACCESS_KEY_ID:?缺少 RW_S3_ACCESS_KEY_ID，先运行 node service/scripts/up.mjs 生成 .env}
  RW_S3_SECRET_ACCESS_KEY: ${RW_S3_SECRET_ACCESS_KEY:?缺少 RW_S3_SECRET_ACCESS_KEY，先运行 node service/scripts/up.mjs 生成 .env}
  RW_LOG_LEVEL: ${RW_LOG_LEVEL:-info}

# webhook 投递（票据 11）：服务密钥加密各 webhook 的签名密钥。接口进程按这些值投递；Docker 后端测试的 tester 用同一个密钥与同样的数值。
# 本机开发要投给本机或内网的接收端时设 RW_WEBHOOK_ALLOW_PRIVATE=true；生产只投 https 与公网地址。
x-webhook-env: &webhook-env
  RW_SECRET_KEY: ${RW_SECRET_KEY:?缺少 RW_SECRET_KEY，先运行 node service/scripts/up.mjs 补全 .env}
  RW_WEBHOOK_ALLOW_PRIVATE: ${RW_WEBHOOK_ALLOW_PRIVATE:-false}
  RW_WEBHOOK_POLL_MS: ${RW_WEBHOOK_POLL_MS:-1000}
  RW_WEBHOOK_RETRY_BASE_MS: ${RW_WEBHOOK_RETRY_BASE_MS:-60000}
  RW_WEBHOOK_MAX_ATTEMPTS: ${RW_WEBHOOK_MAX_ATTEMPTS:-8}
  RW_WEBHOOK_TIMEOUT_MS: ${RW_WEBHOOK_TIMEOUT_MS:-10000}

x-readyz: &readyz
  interval: 3s
  timeout: 5s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: renderweave
      POSTGRES_DB: renderweave
      POSTGRES_PASSWORD: ${RW_POSTGRES_PASSWORD:?缺少 RW_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderweave -d renderweave"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${RW_S3_ACCESS_KEY_ID:?缺少 RW_S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RW_S3_SECRET_ACCESS_KEY:?缺少 RW_S3_SECRET_ACCESS_KEY}
    volumes:
      - s3-data:/data

  # 部署步骤：用属主账号执行数据库迁移、设置应用账号的密码，再建好桶，然后退出。运行时的服务只用读、写、取头信息、列举。
  setup:
    build:
      context: .
      dockerfile: service/Dockerfile
      target: runtime
    image: renderweave-service:local
    command: ["node", "service/dist/main.js", "setup"]
    environment:
      <<: *service-env
      RW_OWNER_DATABASE_URL: postgres://renderweave:${RW_POSTGRES_PASSWORD:?缺少 RW_POSTGRES_PASSWORD}@postgres:5432/renderweave
      RW_APP_DATABASE_PASSWORD: ${RW_APP_DB_PASSWORD:?缺少 RW_APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  # 接口进程：等迁移与代码一致后启动。定期对账（票据 09）：批次的构建没有 worker、闲置超过宽限时间，退回它遗留的预占。
  # 投递 webhook（票据 11）：批次结束的事件签名后发给各 webhook，失败按指数退避重试。
  api:
    image: renderweave-service:local
    pull_policy: never
    command: ["node", "service/dist/main.js", "api"]
    environment:
      <<: [*service-env, *webhook-env]
      RW_RECONCILE_MS: ${RW_RECONCILE_MS:-60000}
      RW_RESERVATION_GRACE_MS: ${RW_RESERVATION_GRACE_MS:-600000}
    ports:
      - "${RW_API_PORT:-8080}:8080"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      <<: *readyz
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # 渲染 worker：调度进程领取任务交给渲染子进程，单项超时由调度进程结束子进程；内存上限是容器的限制，不用交换分区（ADR-0017）。
  # 数值按容量基线定（票据 15，M302，docs/stage4-acceptance.md）：每个 worker 1 个 CPU、2 GB 内存、单项超时 60 秒、做满 500 项换新。
  # 渲染是单线程的，多给 CPU 不变快，要加吞吐就多起 worker：RW_WORKERS 个，宿主端口给一段，如 RW_WORKER_PORT=8081-8088。
  # Docker 后端测试用极小的值（service/scripts/test-docker.mjs）。
  # 停止时排空：不再领预览，做完本构建已接受的批次项再退出（票据 07），所以停止宽限要够做完排队的批次。
  worker:
    image: renderweave-service:local
    pull_policy: never
    command: ["node", "service/dist/main.js", "worker"]
    stop_grace_period: ${RW_WORKER_STOP_GRACE:-30m}
    environment:
      <<: *service-env
      RW_RENDER_TIMEOUT_MS: ${RW_RENDER_TIMEOUT_MS:-60000}
      RW_RENDER_RECYCLE_AFTER: ${RW_RENDER_RECYCLE_AFTER:-500}
    deploy:
      replicas: ${RW_WORKERS:-1}
    cpus: ${RW_WORKER_CPUS:-1}
    mem_limit: ${RW_WORKER_MEMORY:-2g}
    memswap_limit: ${RW_WORKER_MEMORY:-2g}
    ports:
      - "${RW_WORKER_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *readyz
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # 重放旧构建的记录（票据 08，ADR-0019）：用按构建保留的镜像起一个 worker，它只领自己构建的批次项与重放。
  # RW_REPLAY_IMAGE=renderweave-service:sha256-<构建的十六进制> docker compose --profile replay up -d replay-worker
  replay-worker:
    profiles: ["replay"]
    image: ${RW_REPLAY_IMAGE:-renderweave-service:local}
    pull_policy: never
    command: ["node", "service/dist/main.js", "worker"]
    stop_grace_period: ${RW_WORKER_STOP_GRACE:-30m}
    environment:
      <<: *service-env
      RW_RENDER_TIMEOUT_MS: ${RW_RENDER_TIMEOUT_MS:-60000}
      RW_RENDER_RECYCLE_AFTER: ${RW_RENDER_RECYCLE_AFTER:-500}
    cpus: ${RW_WORKER_CPUS:-1}
    mem_limit: ${RW_WORKER_MEMORY:-2g}
    memswap_limit: ${RW_WORKER_MEMORY:-2g}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *readyz
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

  # Docker 后端测试，只在 test 配置下运行：docker compose --profile test run --rm --build tester
  tester:
    profiles: ["test"]
    build:
      context: .
      dockerfile: service/Dockerfile
      target: test
      args:
        ALPINE_MIRROR: ${RW_ALPINE_MIRROR:-}
    image: renderweave-service-test:local
    environment:
      <<: [*service-env, *webhook-env]
      RW_OWNER_DATABASE_URL: postgres://renderweave:${RW_POSTGRES_PASSWORD:?缺少 RW_POSTGRES_PASSWORD}@postgres:5432/renderweave
      RW_API_URL: http://api:8080
      RW_WORKER_URL: http://worker:8081
      RW_RENDER_TIMEOUT_MS: ${RW_RENDER_TIMEOUT_MS:-60000}
      RW_RENDER_RECYCLE_AFTER: ${RW_RENDER_RECYCLE_AFTER:-500}
    depends_on:
      worker:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
