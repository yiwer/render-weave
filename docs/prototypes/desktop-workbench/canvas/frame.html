<!doctype html>
<meta charset="utf-8">
<title>frame</title>
<style>html,body{margin:0;overflow:hidden;background:#888}iframe{border:0;transform-origin:0 0;display:block}</style>
<iframe id="f"></iframe>
<script>
// 用法：frame.html?p=project/Workbench.dc.html&w=1440&h=900 ，按窗口宽度缩放整页
const q = new URLSearchParams(location.search);
const w = Number(q.get('w') || 1440), h = Number(q.get('h') || 900);
const f = document.getElementById('f');
f.width = w; f.height = h; f.src = q.get('p') || 'project/TaskList.dc.html';
const fit = () => { f.style.transform = 'scale(' + Math.min(innerWidth / w, innerHeight / h) + ')'; };
addEventListener('resize', fit); fit();
</script>
