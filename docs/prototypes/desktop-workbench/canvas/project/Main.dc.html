<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FDFBF6;font-family:'Plus Jakarta Sans','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;color:#22150F;-webkit-font-smoothing:antialiased}
a{color:#8E3B24}a:hover{color:#722B18}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.win button:hover{background:#ECE3D3}
.win button.close:hover{background:#C42B1C;color:#FFFFFF}
.cta:hover{background:#722B18 !important;color:#FFFFFF !important}
.pill:hover{background:#D9C8B0 !important}
.field:focus-within{border-color:#8E3B24 !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid #8E3B24;outline-offset:2px}
@media (max-width:1040px){.art{padding:0 16px 16px !important}.lead{padding:8px 16px 40px !important}}
/* 动效：织线标志描线、Agent 执行中的织梭、勾选描线与状态微动；系统要求减少动态时全部停下 */
@keyframes rw-draw{from{stroke-dashoffset:var(--len)}}
@keyframes rw-shuttle{from{stroke-dashoffset:6px}to{stroke-dashoffset:calc(var(--len) * -1px)}}
@keyframes rw-ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes rw-bob{0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
@keyframes rw-rise{from{opacity:0;transform:translateY(6px)}}
@keyframes rw-twinkle{0%,72%,100%{transform:scale(1) rotate(0)}82%{transform:scale(1.2) rotate(14deg)}91%{transform:scale(.94) rotate(-4deg)}}
@keyframes rw-grow{from{transform:scaleX(0)}}
@keyframes rw-stripes{to{background-position:16px 0}}
@keyframes rw-spin{to{transform:rotate(360deg)}}
@keyframes rw-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes rw-glow{0%{box-shadow:0 0 0 0 rgba(241,125,19,.38)}100%{box-shadow:0 0 0 10px rgba(241,125,19,0)}}
@keyframes rw-breathe{from{opacity:.35}}
@keyframes rw-sheet{0%{transform:translateY(-8px);opacity:0}30%,72%{transform:translateY(0);opacity:1}100%{transform:translateY(3px);opacity:0}}
@keyframes rw-send{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(14px);opacity:0}}
@keyframes rw-fade{from{opacity:0}}
.rw-mark path{stroke-dasharray:var(--len);animation:rw-draw .9s cubic-bezier(.65,0,.35,1) both}
.rw-mark path+path{animation-delay:.22s}
.rw-loom .t{stroke-dasharray:6 var(--len);animation:rw-shuttle 1.6s cubic-bezier(.45,0,.55,1) infinite}
.rw-loom .t+.t{animation-delay:-.8s}
.rw-check path,.rw-check circle{stroke-dasharray:var(--len);animation:rw-draw .5s .1s cubic-bezier(.65,0,.35,1) both}
.rw-check circle+path{animation-delay:.45s}
.rw-ping{position:relative}
.rw-ping::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;animation:rw-ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.rw-bob{animation:rw-bob 2.2s ease-in-out infinite}
.rw-rise{animation:rw-rise .4s cubic-bezier(.2,.8,.2,1) both}
.rw-twinkle{transform-box:fill-box;transform-origin:center;animation:rw-twinkle 3.6s ease-in-out infinite}
.rw-grow{transform-origin:left center;animation:rw-grow .9s cubic-bezier(.2,.8,.2,1) both}
.rw-stripes{background-image:linear-gradient(45deg,rgba(255,255,255,.4) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.4) 75%,transparent 75%);background-size:16px 16px;animation:rw-stripes .8s linear infinite}
.rw-spin{animation:rw-spin .9s linear infinite}
.rw-breathe{animation:rw-breathe 1.1s ease-in-out infinite alternate}
.rw-glow{animation:rw-glow 1.6s cubic-bezier(0,0,.2,1) infinite}
.rw-sheet{transform-box:fill-box;animation:rw-sheet 1.6s cubic-bezier(.3,.7,.3,1) infinite}
.rw-send{transform-box:fill-box;animation:rw-send 1.8s ease-in-out infinite}
.rw-fade{animation:rw-fade 1.2s ease-out both}
.cta:hover .rw-go{animation:rw-nudge .8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#FDFBF6;color:#22150F">
  <header style="height:40px;flex:none;display:flex;align-items:center;background:#FDFBF6">
    <span class="win" style="margin-left:auto;display:flex">
      <button type="button" aria-label="最小化" style="width:46px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:#5B4334"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
      <button type="button" aria-label="最大化" style="width:46px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:#5B4334"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><rect x="5" y="5" width="14" height="14" rx="1.5"></rect></svg></button>
      <button type="button" class="close" aria-label="关闭" style="width:46px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:#5B4334"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </span>
  </header>

  <div style="flex:1;display:flex;flex-wrap:wrap">
    <section class="lead" style="flex:1 1 520px;min-width:0;box-sizing:border-box;padding:0 48px 48px;display:flex;flex-direction:column">
      <span style="display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-0.3px;color:#22150F">
        <svg class="rw-mark" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#F17D13"></rect><path d="M6 8.5c4 0 4 7 8 7s4-7 4-7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" style="--len:21"></path><path d="M6 15.5c4 0 4-7 8-7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" style="--len:12"></path></svg>
        RenderWeave
      </span>

      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:48px 0 24px">
        <form class="rw-rise" aria-label="登录" style="width:100%;max-width:380px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;animation-delay:.2s">
          <label for="login-email" class="sr">邮箱</label>
          <input id="login-email" class="field" type="email" autocomplete="username" placeholder="输入邮箱" style="height:48px;padding:0 14px;border:1px solid #BFAA8E;border-radius:12px;font-size:15px;background:#FFFFFF;box-sizing:border-box;outline:none">

          <label for="login-password" class="sr">密码</label>
          <div class="field" style="display:flex;align-items:center;height:48px;border:1px solid #BFAA8E;border-radius:12px;background:#FFFFFF;padding-right:6px;box-sizing:border-box">
            <input id="login-password" type="password" autocomplete="current-password" placeholder="输入密码" style="flex:1;min-width:0;height:46px;padding:0 14px;border:0;border-radius:12px;font-size:15px;background:transparent;outline:none">
            <button type="button" style="height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#722B18;font-size:14px;font-weight:600">显示</button>
          </div>

          <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#5B4334;padding:2px 2px 4px">
            <input type="checkbox" style="width:17px;height:17px;margin:0;accent-color:#F17D13">
            保持登录
          </label>

          <a class="cta" href="TaskList.dc.html" style="height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:#8E3B24;color:#FFFFFF;font-size:16px;font-weight:700;text-decoration:none">登录<svg class="i rw-go" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </form>

        <a class="pill rw-rise" href="#server" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:#F6EDDF;color:#22150F;font-size:14px;font-weight:600;text-decoration:none;animation-delay:.32s">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;color:#5B4334"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          app.renderweave.example · 更换服务地址
        </a>
      </div>
    </section>

    <aside class="art" aria-label="品牌影像" style="flex:1 1 520px;min-width:0;box-sizing:border-box;padding:28px 48px 48px 0;display:flex">
      <div class="rw-fade" style="position:relative;flex:1;min-height:440px;border-radius:16px;overflow:hidden;background:#B9A992">
        <video data-rw-art="" src="/_blob/b3a5ce02da44d056a3771dc00715dd38" poster="/_blob/48c42927110fc647d40c389262c6b0c6" autoplay="" muted="" loop="" playsinline="" preload="auto" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{focus}}% 50%"></video>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focus":{"editor":"range","min":0,"max":100,"step":1,"unit":"%","default":55,"section":"影像"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    const v = typeof document === 'undefined' ? null : document.querySelector('video[data-rw-art]');
    if (!v) return;
    v.muted = true;
    // 系统要求减少动态时停在封面帧；其余情况确保静音自动播放
    const reduce = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      v.pause();
      return;
    }
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }
  renderVals() {
    return { focus: this.props.focus ?? 55 };
  }
}
</script>
</body>
</html>
