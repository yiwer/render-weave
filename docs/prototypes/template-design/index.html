<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RenderWeave 模板设计</title>
<style>
/* 版式：引擎出的图铺在织纹舞台上，结构与检查器浮在两侧，样例带贴底；配色沿用控制台 M361（画室视频），控制台只有浅色，这里同样只做浅色 */
:root {
  --bg: #f7f4ec; --chrome: #ece5d7; --surface: #fdfcf8; --sunken: #e9e2d4; --accent-soft: #eee6d8; --hover: #f1ede3;
  --ink: #1d262e; --muted: #5b4a39; --faint: #6f6251;
  --line: #d6cdbd; --hair: #e6dfd2; --field: #a89c88;
  --accent: #293642; --mark: #b38047; --clay: #946350; --olive: #535a2c; --slate: #556469;
  --ok: #4f5e2a; --warn: #8a5a1f; --warn-soft: #f3e7d2; --bad: #9c3f27; --bad-soft: #f4e2da;
  --r: 8px; --r-card: 12px;
  --shadow: 0 1px 2px rgba(29,38,46,.06), 0 12px 32px rgba(29,38,46,.10);
  --spring: cubic-bezier(.22,1,.36,1);
  --sans: -apple-system,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --mono: ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --left-w: 288px; --right-w: 328px; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 11.5px; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 1px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }

.app { height: 100%; display: grid; grid-template-rows: 44px 44px minmax(0,1fr) auto 28px; }
/* 标题栏（全局框架） */
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; }
.module { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.cmd { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--muted); min-width: 220px; }
.cmd kbd { margin-left: auto; font: 600 11px var(--sans); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.grow { flex: 1 1 auto; min-width: 0; }
/* 文档条 */
.docbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--bg); border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; display: inline-block; }
.dot.warn { background: var(--mark); } .dot.bad { background: var(--bad); } .dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--field); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.btn:hover:not(:disabled) { background: var(--hover); } .btn:disabled { color: var(--field); cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--ink); } .btn.primary:disabled { background: var(--sunken); border-color: var(--sunken); color: var(--faint); }
.btn.quiet { border-color: transparent; background: transparent; } .btn.quiet:hover:not(:disabled) { background: var(--hover); }
.btn.icon { width: 28px; padding: 0; }

/* 舞台 */
.stage-wrap { position: relative; overflow: hidden; min-height: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; background-color: #e7e0d2;
  background-image: repeating-linear-gradient(45deg, rgba(41,54,66,.055) 0 1px, transparent 1px 9px), repeating-linear-gradient(135deg, rgba(179,128,71,.075) 0 1px, transparent 1px 9px); cursor: default; }
.stage.pan { cursor: grab; } .stage.panning { cursor: grabbing; }
.board { position: absolute; background: #fff; box-shadow: 0 2px 4px rgba(29,38,46,.08), 0 18px 44px rgba(29,38,46,.18); }
.board img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; transition: opacity .15s; }
.board.busy img { opacity: .72; }
.overlay { position: absolute; inset: 0; }
.box { position: absolute; pointer-events: none; }
.box.hover { outline: 1px solid var(--accent); outline-offset: -1px; background: rgba(41,54,66,.05); }
.box.struct { outline: 1px solid rgba(41,54,66,.28); outline-offset: -.5px; } .box.struct.leaf { outline-color: rgba(179,128,71,.55); }
.box.sel { outline: 2px solid var(--mark); outline-offset: -1px; transition: left .16s var(--spring), top .16s var(--spring), width .16s var(--spring), height .16s var(--spring); }
.box.other { outline: 1px dashed var(--mark); outline-offset: -.5px; }
.box.usevar { outline: 1.5px solid var(--olive); outline-offset: -1px; background: rgba(83,90,44,.14); }
.box.fit { background: rgba(179,128,71,.28); outline: 1px solid rgba(138,90,31,.75); outline-offset: -1px; }
.box.fit.over { background: rgba(156,63,39,.34); outline-color: var(--bad); }
.box.data { background: rgba(85,100,105,.20); outline: 1px solid rgba(85,100,105,.55); outline-offset: -1px; }
.box.fixed { outline: 1px dashed rgba(148,99,80,.75); outline-offset: -1px; }
.tag { position: absolute; left: -2px; bottom: 100%; margin-bottom: 3px; padding: 0 6px; border-radius: 4px; background: var(--ink); color: var(--bg); font: 11px/18px var(--sans); white-space: nowrap; pointer-events: none; z-index: 6; }
.tag.under { bottom: auto; top: 100%; margin: 3px 0 0; }
.mark { position: absolute; box-shadow: inset 0 0 0 1.5px var(--bad); pointer-events: none; }
.mark.hint { box-shadow: inset 0 0 0 1.5px var(--warn); }
.mark b { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--bad); color: #fff; font: 700 10px/16px var(--sans); text-align: center; pointer-events: auto; cursor: pointer; }
.mark.hint b { background: var(--warn); }
.pct { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); padding: 0 3px; border-radius: 3px; background: var(--ink); color: var(--bg); font: 9.5px/14px var(--sans); pointer-events: none; white-space: nowrap; }
.h { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #fff; border: 1.5px solid var(--mark); border-radius: 2px; pointer-events: auto; z-index: 5; }
.gapbar { position: absolute; pointer-events: auto; background: repeating-linear-gradient(135deg, rgba(179,128,71,.55) 0 2px, rgba(179,128,71,.12) 2px 5px); z-index: 4; }
.gapbar.row { cursor: ew-resize; } .gapbar.col { cursor: ns-resize; }
.padbar { position: absolute; pointer-events: none; background: repeating-linear-gradient(45deg, rgba(85,100,105,.4) 0 2px, rgba(85,100,105,.08) 2px 5px); }
.track { position: absolute; background: var(--mark); pointer-events: auto; z-index: 4; }
.track.h-line { left: -14px; right: -14px; height: 1px; cursor: ns-resize; } .track.v-line { top: -14px; bottom: -14px; width: 1px; cursor: ew-resize; }
.track::after { content: ""; position: absolute; inset: -4px; }
.tracklabel { position: absolute; font: 10px/14px var(--mono); color: var(--ink); background: var(--warn-soft); border-radius: 3px; padding: 0 4px; pointer-events: none; white-space: nowrap; z-index: 4; }
.readout { position: absolute; z-index: 9; padding: 2px 7px; border-radius: 5px; background: var(--ink); color: var(--bg); font: 11px/16px var(--mono); pointer-events: none; white-space: nowrap; }
.ghost { position: absolute; outline: 2px dashed var(--accent); outline-offset: -1px; background: rgba(41,54,66,.08); pointer-events: none; z-index: 8; }
.dropline { position: absolute; background: var(--accent); pointer-events: none; z-index: 8; }
.compare-clip { position: absolute; inset: 0; overflow: hidden; }
.compare-clip img { position: absolute; left: 0; top: 0; height: 100%; max-width: none; }
.compare-bar { position: absolute; top: -10px; bottom: -10px; width: 2px; background: var(--ink); cursor: ew-resize; z-index: 7; }
.compare-bar i { position: absolute; top: 50%; left: -9px; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: var(--ink); }

/* 选区条 */
.chip { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 12; max-width: calc(100% - var(--left-w) - var(--right-w) - 72px); display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-size: 12px; white-space: nowrap; }
.chip .path { display: flex; align-items: center; gap: 3px; overflow: hidden; direction: rtl; min-width: 0; }
.chip .path > span { direction: ltr; display: inline-flex; align-items: center; gap: 3px; }
.chip button.seg { border: 0; background: none; padding: 1px 3px; border-radius: 4px; color: var(--muted); }
.chip button.seg:hover { background: var(--hover); color: var(--ink); } .chip button.seg.now { color: var(--ink); font-weight: 650; }
.chip button.seg.tpl { color: var(--clay); }
.chip .scope { padding-left: 10px; border-left: 1px solid var(--hair); color: var(--muted); flex: none; }
.chip .scope b { color: var(--ink); font-weight: 650; }
.slash { color: var(--field); }

/* 浮动面板 */
.panel { position: absolute; top: 10px; bottom: 10px; z-index: 11; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow); min-height: 0; }
.panel.left { left: 10px; width: var(--left-w); } .panel.right { right: 10px; width: var(--right-w); }
.panel[hidden] { display: none; }
.tabs { flex: none; display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--hair); }
.tabs button { border: 0; background: none; padding: 5px 8px 7px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); } .tabs button.on { color: var(--ink); font-weight: 650; border-bottom-color: var(--mark); }
.tabs .count { color: var(--bad); font-weight: 700; margin-left: 3px; }
.scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
/* 结构树 */
.tree { padding: 6px 0 12px; }
.row { position: relative; display: flex; align-items: center; gap: 5px; height: 26px; padding-right: 8px; cursor: default; white-space: nowrap; }
.row:hover { background: var(--hover); } .row.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--mark); } .row.dim .nm { color: var(--faint); }
.row .tw { width: 14px; height: 14px; flex: none; display: grid; place-items: center; color: var(--faint); border: 0; background: none; padding: 0; }
.row .tw svg { width: 11px; height: 11px; transition: transform .12s; } .row .tw.open svg { transform: rotate(90deg); }
.row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .bd { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--faint); font-size: 10.5px; }
.row .bd .e { color: var(--bad); }
.row.scope-head { height: 22px; font-size: 11px; color: var(--clay); }
.row.scope-head .nm { color: var(--clay); }
.band { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(148,99,80,.35); }
.pill { display: inline-block; padding: 0 5px; border-radius: 4px; background: var(--sunken); font-size: 10.5px; color: var(--muted); line-height: 16px; }
/* 变量面板 */
.vscope { padding: 8px 12px; border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--muted); }
.vscope b { color: var(--ink); }
.vgroup { padding: 8px 0 4px; }
.vgroup h4 { margin: 0; padding: 2px 12px 4px; font-size: 11.5px; font-weight: 650; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.vgroup h4 span { color: var(--faint); font-weight: 400; }
.vrow { display: flex; align-items: center; gap: 7px; padding: 3px 12px; min-height: 26px; cursor: default; }
.vrow:hover { background: var(--hover); } .vrow.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--mark); }
.vrow .gl { width: 16px; flex: none; text-align: center; font: 600 10px var(--mono); color: var(--slate); }
.vrow .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .val { flex: none; max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; }
.vrow.fired .val { color: var(--bad); font-weight: 650; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(29,38,46,.2); display: inline-block; }
/* 添加 */
.pal { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 10px 12px; }
.pal button { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; border: 1px solid var(--hair); border-radius: var(--r); background: var(--bg); font-size: 11.5px; }
.pal button:hover { border-color: var(--field); background: var(--hover); }
.palh { padding: 8px 12px 0; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.fld { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12px; } .fld:hover { background: var(--hover); }
.fld .arrow { color: var(--faint); margin-left: auto; font-size: 11px; white-space: nowrap; }
/* Agent 占位 */
.agent { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
.agent .say { padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--hair); font-size: 12.5px; }
.agent .box2 { margin-top: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; background: var(--bg); }
/* 检查器 */
.ihead { flex: none; padding: 10px 12px 8px; border-bottom: 1px solid var(--hair); }
.ihead h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.ihead .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.impact { margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--warn-soft); font-size: 12px; color: var(--warn); }
.states { padding: 8px 12px; border-bottom: 1px solid var(--hair); background: var(--bg); }
.states .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.states .cases { display: flex; flex-wrap: wrap; gap: 4px; }
.case { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 7px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.case.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.case.ghost-case { border-style: dashed; color: var(--faint); }
.case small { font-size: 10.5px; opacity: .75; }
.sec { padding: 9px 12px 10px; border-bottom: 1px solid var(--hair); }
.sec h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 650; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sec h4 span { font-weight: 400; color: var(--faint); }
.f { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 6px; align-items: center; min-height: 28px; }
.f > label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }
.f > label.ov::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--mark); flex: none; }
.f + .f { margin-top: 2px; }
.cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
.inp { flex: 1 1 auto; min-width: 0; height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); }
.inp:focus-within { border-color: var(--field); background: #fff; }
.inp input { flex: 1 1 auto; width: 100%; min-width: 0; border: 0; outline: 0; background: none; padding: 0; font-variant-numeric: tabular-nums; }
.inp .u { color: var(--faint); font-size: 11px; flex: none; }
.bound { flex: 1 1 auto; min-width: 0; height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 6px; border: 1px solid rgba(85,100,105,.45); border-radius: 6px; background: rgba(85,100,105,.10); text-align: left; }
.bound:hover { background: rgba(85,100,105,.17); }
.bound .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bound .cv { margin-left: auto; flex: none; color: var(--faint); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; }
.bind { flex: none; width: 24px; height: 26px; border: 0; background: none; color: var(--faint); border-radius: 5px; display: grid; place-items: center; }
.bind:hover { background: var(--hover); color: var(--ink); } .bind.on { color: var(--slate); }
.nobind { flex: none; width: 24px; text-align: center; color: var(--hair); }
.f.chain-row { min-height: 0; margin-top: 0; }
.chain { grid-column: 2; font-size: 11.5px; color: var(--faint); margin: 1px 0 3px; }
.chain button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-decoration-color: var(--field); text-underline-offset: 2px; font-size: 11.5px; }
.seg-group { display: inline-flex; flex: 1 1 auto; padding: 2px; gap: 2px; border-radius: 6px; background: var(--sunken); min-width: 0; }
.seg-group button { flex: 1 1 auto; border: 0; background: none; border-radius: 4px; padding: 0 4px; height: 22px; font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 0; }
.seg-group button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 1px rgba(29,38,46,.1); }
.seg-group button:disabled { color: var(--field); cursor: not-allowed; }
.content { display: flex; flex-wrap: wrap; gap: 3px; padding: 5px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); min-height: 30px; align-items: center; }
.tok { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; border-radius: 4px; font-size: 12px; line-height: 20px; }
.tok.lit { background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); }
.tok.slot { background: rgba(85,100,105,.14); box-shadow: inset 0 0 0 1px rgba(85,100,105,.4); }
.tok em { font: 10.5px var(--mono); color: var(--faint); font-style: normal; }
.steps { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; font-size: 12px; }
.step { padding: 0 6px; border-radius: 4px; background: var(--sunken); color: var(--faint); line-height: 20px; }
.step.on { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.result { margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--hair); font-size: 12px; color: var(--muted); }
.result b { color: var(--ink); font-weight: 650; } .result.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); } .result.bad b { color: var(--bad); }
.args { width: 100%; border-collapse: collapse; font-size: 12px; }
.args td { padding: 3px 0; border-top: 1px solid var(--hair); vertical-align: middle; } .args tr:first-child td { border-top: 0; }
.args td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
.src { display: inline-flex; align-items: center; gap: 4px; padding: 0 5px; border-radius: 4px; background: rgba(85,100,105,.12); line-height: 20px; }
.src.loop { background: rgba(179,128,71,.18); } .src.none { background: none; color: var(--faint); padding: 0; }
.branch { border: 1px solid var(--hair); border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; background: var(--bg); font-size: 12px; }
.branch.hit { border-color: var(--mark); background: var(--warn-soft); }
.branch .kw { color: var(--faint); font-size: 11px; margin-right: 4px; }
.branch .ln { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.op { color: var(--muted); }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-decoration-color: var(--field); text-underline-offset: 2px; font-size: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 2px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.note { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
.tiny-list { margin: 0; padding: 0; list-style: none; font-size: 12px; } .tiny-list li { padding: 1px 0; }
/* 操作条 */
