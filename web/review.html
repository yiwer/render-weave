<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RenderWeave 审核</title>
<style>
  :root {
    --bg: #f7f4ef; --panel: #fffdf9; --line: #e4ddd2; --text: #2b2824; --muted: #7a7166;
    --accent: #b4532a; --accent-soft: #f6e6dc; --ok: #3f7d4e; --ok-soft: #e3f0e4; --warn: #a86b12; --warn-soft: #fbefd9;
    --bad: #b03a2e; --bad-soft: #f8e1dd; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .dir { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--line); color: var(--text); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.accent { background: var(--accent-soft); color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(360px, 46%) 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .viewer { position: static !important; } }
  section, .viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .viewer { position: sticky; top: 64px; }
  .pane + .pane { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .stack > * + * { margin-top: 16px; }
  .stack, .viewer { min-width: 0; }
  td code, td.mono { word-break: break-all; }
  h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .viewport { position: relative; overflow: auto; height: 420px; background: #ece6dc; border-radius: 6px; cursor: zoom-in; }
  .canvas { position: relative; }
  .canvas img { display: block; image-rendering: auto; user-select: none; }
  .mark { position: absolute; border: 3px solid var(--accent); background: rgba(180, 83, 42, .12); box-shadow: 0 0 0 9999px rgba(43, 40, 36, .18); pointer-events: none; }
  .caption { margin-top: 6px; color: var(--muted); min-height: 1.5em; }
  .muted { color: var(--muted); }
  .mono, pre, code, textarea { font-family: var(--mono); font-size: 12px; }
  pre { margin: 6px 0 0; padding: 8px; background: #f3eee6; border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
  textarea { width: 100%; min-height: 150px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card + .card { margin-top: 10px; }
  .card.done { border-color: #cfe1d1; }
  .card-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .choices { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 4px; }
  .choices label { cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .scroll { max-height: 560px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 6px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; border-top: none; position: sticky; top: 0; background: var(--panel); }
  tr.removed td { color: var(--muted); text-decoration: line-through; }
  tr.edited td:first-child { box-shadow: inset 3px 0 var(--accent); }
  tr.pending td:first-child { box-shadow: inset 3px 0 var(--warn); }
  .problems { margin: 0; padding-left: 18px; }
  .problems li.severe { color: var(--bad); }
  .notes { white-space: pre-wrap; word-break: break-word; }
  .toast { position: fixed; right: 20px; bottom: 20px; max-width: 520px; padding: 10px 14px; border-radius: 8px; background: var(--text); color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.2); display: none; white-space: pre-wrap; z-index: 10; }
  details summary { cursor: pointer; color: var(--accent); }
  a.locate { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1 id="title">审核</h1>
  <span id="status" class="chip">读取中</span>
  <span id="verdict" class="chip"></span>
  <span id="round" class="chip"></span>
  <span id="dir" class="dir"></span>
</header>
<main>
  <div class="viewer" id="viewer"></div>
  <div class="stack" id="content"></div>
</main>
<div id="toast" class="toast"></div>
<script>
'use strict';
let view = null;
let execution = null;
let checkpoint = null;
const $ = (id) => document.getElementById(id);
/** 只用 textContent 建节点：Agent 写的说明与候选内容都不当作 HTML。 */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs ?? {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key === 'class') node.className = value;
    else node.setAttribute(key, value === true ? '' : String(value));
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
}
const json = (value) => JSON.stringify(value, null, 2);
const STATUS = { inProgress: ['审核中', 'warn'], approved: ['已通过', 'ok'], rejected: ['未通过', 'bad'] };
const ACTIONS = { adopt: '采纳候选', edit: '改值', empty: '标为空' };
const KINDS = { definition: '定义', dataset: '数据集', template: '模板' };

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { node.style.display = 'none'; }, 6000);
}

async function load() {
  const response = await fetch('/api/review');
  const body = await response.json();
  execution = body.execution ?? null;
  checkpoint = body.checkpoint ?? null;
  if (!body.view) {
    $('title').textContent = '轮次状态';
    $('status').textContent = body.execution ? '状态已读取' : '无法读取';
    $('verdict').textContent = '尚无可审核成果';
    $('viewer').style.display = 'none';
    document.querySelector('main').style.gridTemplateColumns = '1fr';
    $('content').replaceChildren(body.execution ? executionPanel(body.execution) : h('section', {}, h('h2', {}, '无法审核')), problemList(body.problems ?? []));
    if (body.execution && !body.execution.committed && body.execution.status === 'running') setTimeout(load, 2000);
    return;
  }
  view = body.view;
  $('viewer').style.display = '';
  document.querySelector('main').style.gridTemplateColumns = '';
  render();
}

function executionPanel(execution) {
  const phases = { preparing: '准备', executing: '执行', finalizing: '收尾', completed: '完成收尾' };
  const statuses = { running: '运行中', completed: '执行完成', failed: '失败', stopped: '已停止', interrupted: '已中断', pendingRecovery: '待恢复确认' };
  return h('section', {}, h('h2', {}, `轮次状态：${phases[execution.phase]} · ${statuses[execution.status]}`),
    h('p', {}, execution.committed ? '最终记录已提交。技术、内容/视觉和人工审核结论分别见下方；执行完成不会自动批准或应用。' : execution.diagnostics.join('；')),
    execution.start && h('p', {}, `第 ${execution.start.round} 轮 · ${execution.start.task} · 输入身份 ${execution.start.inputIdentity}`),
    checkpoint && h('p', {}, `完整检查点已保存：${checkpoint.id} · 内容身份 ${checkpoint.contentIdentity}。来源：宿主恢复候选；可用 --from 开新轮次，不能直接批准或应用。`),
    checkpoint && h('details', {}, h('summary', {}, '已检查的集合与问题'), h('pre', {}, json({ files: checkpoint.files, check: checkpoint.check }))),
    h('details', {}, h('summary', {}, '固定输入与关键事件'), h('pre', {}, json({ inputs: execution.start?.inputs, events: execution.events }))));
}

async function change(payload) {
  const response = await fetch('/api/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
  const body = await response.json();
  if (body.view) { view = body.view; render(); }
  if (body.problems && body.problems.length > 0) toast(body.problems.map((problem) => problem.message).join('\n'));
  else if (body.error) toast(body.error);
  return response.ok;
}

// ---------- 图片查看：示例图与预览各一个，缩放与滚动可以联动 ----------
class Viewer {
  constructor(title, hint) {
    this.scale = 1; this.fitted = true; this.marked = null; this.syncing = false;
    this.img = h('img', { alt: title });
    this.mark = h('div', { class: 'mark', hidden: true });
    this.label = h('span', { class: 'muted' });
    this.caption = h('div', { class: 'caption' }, hint);
    this.viewport = h('div', { class: 'viewport', title: '单击放大，Shift+单击缩小' }, h('div', { class: 'canvas' }, this.img, this.mark));
    const zoom = (text, value) => h('button', { onclick: () => value === 'fit' ? this.fit() : this.zoomCenter(value) }, text);
    this.node = h('div', { class: 'pane' },
      h('div', { class: 'toolbar' }, h('strong', {}, title), zoom('适应', 'fit'), zoom('100%', 1), zoom('200%', 2), zoom('400%', 4),
        h('button', { onclick: () => this.clearMark() }, '清除标记'), this.label),
      this.viewport, this.caption);
    this.img.addEventListener('load', () => { sizeViewports(); this.fit(); });
    this.viewport.addEventListener('click', (event) => {
      const rect = this.viewport.getBoundingClientRect();
      const viewX = event.clientX - rect.left, viewY = event.clientY - rect.top;
      this.fitted = false;
      this.apply(this.scale * (event.shiftKey ? 0.5 : 2), { x: (this.viewport.scrollLeft + viewX) / this.scale, y: (this.viewport.scrollTop + viewY) / this.scale, viewX, viewY });
    });
    this.viewport.addEventListener('scroll', () => this.sync());
  }
  setSource(src) { if (this.img.getAttribute('src') !== src) this.img.src = src; }
  apply(next, anchor) {
    if (!this.img.naturalWidth) return;
    this.scale = Math.min(8, Math.max(0.03, next));
    this.img.style.width = `${this.img.naturalWidth * this.scale}px`;
    this.img.style.height = `${this.img.naturalHeight * this.scale}px`;
    this.label.textContent = `${Math.round(this.scale * 100)}%（${this.img.naturalWidth} × ${this.img.naturalHeight}）`;
    if (anchor) {
      this.viewport.scrollLeft = anchor.x * this.scale - anchor.viewX;
      this.viewport.scrollTop = anchor.y * this.scale - anchor.viewY;
    }
    this.placeMark();
    this.sync();
  }
  fit() {
    if (!this.img.naturalWidth) return;
    this.fitted = true;
    this.apply(Math.min(this.viewport.clientWidth / this.img.naturalWidth, this.viewport.clientHeight / this.img.naturalHeight));
  }
  zoomCenter(value) {
    this.fitted = false;
    const v = this.viewport;
    this.apply(value, { x: (v.scrollLeft + v.clientWidth / 2) / this.scale, y: (v.scrollTop + v.clientHeight / 2) / this.scale, viewX: v.clientWidth / 2, viewY: v.clientHeight / 2 });
  }
  /** 让其余查看器显示同一处：各图按显示宽度对齐（预览按示例图的像素宽度出图）。 */
  sync() {
    if (this.syncing || !$('sync')?.checked || !this.img.naturalWidth) return;
    for (const peer of viewers()) {
      if (peer === this || !peer.img.naturalWidth) continue;
      peer.syncing = true;
      peer.fitted = this.fitted;
      peer.scale = this.scale * this.img.naturalWidth / peer.img.naturalWidth;
      peer.img.style.width = `${peer.img.naturalWidth * peer.scale}px`;
      peer.img.style.height = `${peer.img.naturalHeight * peer.scale}px`;
      peer.label.textContent = `${Math.round(peer.scale * 100)}%（${peer.img.naturalWidth} × ${peer.img.naturalHeight}）`;
      peer.viewport.scrollLeft = this.viewport.scrollLeft;
      peer.viewport.scrollTop = this.viewport.scrollTop * (peer.img.naturalHeight * peer.scale) / Math.max(1, this.img.naturalHeight * this.scale);
      peer.placeMark();
      requestAnimationFrame(() => { peer.syncing = false; });
    }
  }
  placeMark() {
    if (!this.marked || !this.marked.region) { this.mark.hidden = true; return; }
    const r = this.marked.region;
    Object.assign(this.mark.style, { left: `${r.x * this.scale}px`, top: `${r.y * this.scale}px`, width: `${r.width * this.scale}px`, height: `${r.height * this.scale}px` });
    this.mark.hidden = false;
  }
  locate(location, label) {
    this.marked = location;
    this.caption.textContent = `${label}：${location.where}${location.region ? '' : '（Agent 没有给出区域，只有文字描述）'}`;
    this.node.scrollIntoView({ block: 'nearest' });
    if (location.region) {
      const r = location.region, v = this.viewport;
      this.fitted = false;
      this.apply(Math.min(v.clientWidth / (r.width * 1.6), v.clientHeight / (r.height * 1.6), 4),
        { x: r.x + r.width / 2, y: r.y + r.height / 2, viewX: v.clientWidth / 2, viewY: v.clientHeight / 2 });
    } else this.placeMark();
  }
  clearMark() { this.marked = null; this.placeMark(); this.caption.textContent = ''; }
}

const sample = new Viewer('示例图', '单击图片放大，Shift+单击缩小；点"定位"查看它在示例图上的位置。');
let preview = null, before = null;
const viewers = () => [sample, preview, before].filter(Boolean);
sample.setSource('/sample');
$('viewer').append(sample.node);

/** 查看区高度随图的比例：宽幅图不留大片空白，竖幅图占满窗口；有预览时两者平分。 */
function sizeViewports() {
  const panes = viewers();
  const available = (window.innerHeight - 170) / panes.length - 70;
  for (const pane of panes) {
    if (!pane.img.naturalWidth) continue;
    const atFitWidth = pane.img.naturalHeight * pane.viewport.clientWidth / pane.img.naturalWidth + 4;
    pane.viewport.style.height = `${Math.max(panes.length > 1 ? 140 : 300, Math.min(available, atFitWidth))}px`;
  }
}
window.addEventListener('resize', () => { sizeViewports(); for (const pane of viewers()) if (pane.fitted) pane.fit(); });

function syncPreview() {
  const shown = view.preview;
  if (!shown) return;
  const revision = Boolean(view.previewBefore);
  if (!preview) {
    preview = new Viewer(revision ? '修改后（RenderWeave 用工作副本重新渲染）' : '预览（RenderWeave 重新渲染）', '草稿模式：问题处画框，缺失的值用占位。');
    if (revision) before = new Viewer('修改前（已保存的模板）', '同一出图请求，用工作区中已保存的模板渲染。');
    $('viewer').append(preview.node, ...(before ? [before.node] : []),
      h('label', { class: 'muted' }, h('input', { type: 'checkbox', id: 'sync', checked: true }), ` ${before ? '三图' : '两图'}联动缩放与滚动`));
  }
  for (const [pane, image] of [[preview, shown.image], [before, view.previewBefore?.image]]) {
    if (!pane) continue;
    if (image) pane.setSource(`/${image}`);
    else pane.caption.textContent = '出图请求无法渲染，见预览的问题。';
  }
}
const locateLink = (location, label) => location ? h('a', { class: 'locate', onclick: () => sample.locate(location, label) }, '定位') : null;

// ---------- 页面 ----------
function problemList(problems) {
  if (problems.length === 0) return h('p', { class: 'muted' }, '没有问题。');
  return h('ul', { class: 'problems' }, problems.map((problem) => h('li', { class: problem.level }, `[${problem.level === 'severe' ? '严重' : '提示'}] ${problem.code}：${problem.message}`)));
}

function render() {
  const { round, review, applied } = view;
  const editable = review.status === 'inProgress' && !applied && round.source !== 'hostRecovery';
  document.title = `审核 · ${round.taskName}`;
  $('title').textContent = `审核 · ${round.taskName}`;
  const [label, tone] = applied ? ['已应用', 'accent'] : STATUS[review.status];
  $('status').textContent = label;
  $('status').className = `chip ${tone}`;
  $('verdict').textContent = round.source === 'hostRecovery' ? '中断草稿 · 完成度未知' : round.verdict === 'qualified' ? '技术检查通过 · 待审核' : '受阻成果 · 待处理';
  $('verdict').className = `chip ${round.verdict === 'qualified' ? 'ok' : 'bad'}`;
  $('dir').textContent = round.dir;
  $('round').textContent = `第 ${round.round} 轮`;
  syncPreview();
  $('content').replaceChildren(...[execution && executionPanel(execution), conclusion(editable), roundSection(), previewSection(), pendingSection(editable), ...view.candidates.map(candidateSection), notesSection()].filter(Boolean));
}

function blocking() {
  return [...view.problems, ...view.candidates.flatMap((candidate) => candidate.problems), ...(view.preview?.blocking ? view.preview.problems : [])]
    .filter((problem) => problem.level === 'severe');
}

function conclusion(editable) {
  const { review, applied } = view;
  const comment = h('textarea', { id: 'comment', placeholder: '不通过时写明理由；通过时可留备注', style: 'min-height:60px', disabled: !editable }, review.comment ?? '');
  const decided = view.pending.filter((item) => item.decision).length;
  return h('section', {},
    h('h2', {}, '审核结论'),
    h('p', {}, `待确认项已处理 ${decided} / ${view.pending.length}。`, view.saved ? `审核结果已保存（${review.updatedAt}）。` : '还没有保存过审核结果。'),
    applied ? h('p', {}, `已于 ${applied.appliedAt} 应用到 ${applied.workspace}：`,
      applied.published.map((item) => `${item.name}${item.version ? ` v${item.version}` : ''}${item.replaced ? '（替换已保存的模板）' : ''}`).join('、') || '没有需要写入的内容') : null,
    h('label', {}, h('input', { type: 'checkbox', checked: review.restConfirmed, disabled: !editable,
      onchange: (event) => change({ type: 'confirmRest', confirmed: event.target.checked }) }),
      ' 待确认项以外的内容已整体核对，确认无误'),
    h('div', { style: 'margin-top:8px' }, comment),
    h('div', { class: 'row' },
      h('button', { class: 'primary', disabled: !editable || !view.canApprove, onclick: () => change({ type: 'approve', ...(comment.value.trim() ? { comment: comment.value } : {}) }) }, '审核通过'),
      h('button', { class: 'danger', disabled: !editable, onclick: () => change({ type: 'reject', comment: comment.value }) }, '审核不通过'),
      h('button', { disabled: (review.status === 'inProgress' && !view.problems.some(p => p.code === 'apply.resourcesChanged' || (p.code === 'review.invalid' && p.message.includes('历史轮次')))) || Boolean(applied), onclick: () => change({ type: 'reopen' }) }, '撤回结论 / 重新检查'),
      review.status === 'approved' && !applied ? h('span', { class: 'muted' }, '下一步：renderweave agent apply ', h('code', {}, view.round.dir)) : null),
    h('h3', { style: 'margin-top:12px' }, '还不能通过的原因'),
    problemList(blocking()));
}

/** 轮次链、修改要求与反馈：只有多轮或模板辅助修改时才有内容。 */
function roundSection() {
  const { chain, requirement, feedback } = view.round;
  if (chain.length <= 1 && requirement === undefined && feedback === undefined) return null;
  const REVIEW = { inProgress: '审核中', approved: '已通过', rejected: '未通过' };
  const rows = chain.map((link) => h('tr', { class: link.dir === view.round.dir ? 'edited' : '' },
    h('td', {}, `第 ${link.round} 轮`),
    h('td', {}, link.missing ? h('span', { class: 'chip bad' }, '读不到') : [
      link.executionStatus ? h('span', { class: 'chip warn' }, link.executionStatus === 'interrupted' ? '原轮次已中断' : `执行状态：${link.executionStatus}`) : '',
      link.verdict ? h('span', { class: `chip ${link.verdict === 'qualified' ? 'ok' : 'bad'}` }, link.verdict === 'qualified' ? '合格' : '不合格') : '',
      ' ', link.review ? h('span', { class: 'chip' }, REVIEW[link.review]) : h('span', { class: 'muted' }, '未审核'),
      link.applied ? [' ', h('span', { class: 'chip accent' }, '已应用')] : '']),
    h('td', { class: 'mono' }, link.dir)));
  return h('section', {},
    h('h2', {}, '轮次'),
    chain.length > 1 ? h('table', {}, h('thead', {}, h('tr', {}, ['轮次', '结论', '轮次目录'].map((text) => h('th', {}, text)))), h('tbody', {}, rows)) : null,
    requirement !== undefined ? [h('h3', { style: 'margin-top:12px' }, '修改要求'), h('pre', {}, requirement)] : null,
    feedback !== undefined ? [h('h3', { style: 'margin-top:12px' }, '上一轮审核后的反馈'), h('pre', {}, feedback)] : null);
}

function previewSection() {
  const shown = view.preview;
  if (!shown) return null;
  const old = view.previewBefore;
  const size = (item) => item.dpi ? ` ${item.widthPx} × ${item.heightPx} 像素，${item.dpi} DPI。` : '';
  return h('section', {},
    h('h2', {}, old ? '修改前后的预览' : '预览'),
    h('p', { class: 'muted', style: 'margin-top:0' }, '由 RenderWeave 按出图请求重新渲染（草稿模式），不用 Agent 自己的图。',
      old ? '修改后的预览用审核后的工作副本，严重问题会阻止审核通过；修改前的预览用工作区中已保存的模板。'
        : shown.blocking ? '预览的严重问题会阻止审核通过。' : '预览用的是工作区已保存的模板，问题只作参考。',
      size(shown)),
    h('details', {}, h('summary', {}, '出图请求'), h('pre', {}, json(shown.request))),
    h('h3', { style: 'margin-top:10px' }, old ? '修改后的问题' : '预览的问题'),
    problemList(shown.problems),
    old ? [h('h3', { style: 'margin-top:10px' }, '修改前的问题'), problemList(old.problems)] : null);
}

function pendingSection(editable) {
  return h('section', {}, h('h2', {}, `待确认项（${view.pending.length}）`),
    view.pending.length === 0 ? h('p', { class: 'muted' }, 'Agent 没有列出待确认项。') : view.pending.map((item) => pendingCard(item, editable)));
}

function choiceLabels(item) {
  const kind = view.candidates.find((candidate) => candidate.path === item.file)?.kind ?? 'definition';
  if (item.path === undefined) return { adopt: '采纳候选（保留当前写法）', edit: `改值（改写整份${KINDS[kind]}）`, empty: `标为空（不写入这份${KINDS[kind]}）` };
  if (kind === 'dataset') return { adopt: item.candidate !== undefined ? '采纳候选（用候选值）' : '采纳候选（保留当前值）', edit: '改值（改写这个值）', empty: '标为空（删去这个值）' };
  const what = kind === 'definition' ? '字段' : '元素';
  return { adopt: '采纳候选（保留当前写法）', edit: `改值（改写这个${what}）`, empty: `标为空（删去这个${what}）` };
}

function pendingCard(item, editable) {
  const decision = item.decision;
  const name = `action-${item.item}`;
  const labels = choiceLabels(item);
  const initial = decision?.action === 'edit' ? decision.value : item.current !== undefined ? item.current : item.candidate ?? null;
  const value = h('textarea', { hidden: decision?.action !== 'edit', disabled: !editable }, json(initial));
  const radio = (action) => h('label', {}, h('input', { type: 'radio', name, value: action, checked: decision?.action === action, disabled: !editable,
    onchange: () => { value.hidden = action !== 'edit'; } }), ` ${labels[action]}`);
  const save = () => {
    const chosen = document.querySelector(`input[name="${name}"]:checked`);
    if (!chosen) return toast('先选择处理方式');
    if (chosen.value !== 'edit') return change({ type: 'decide', item: item.item, action: chosen.value });
    let parsed;
    try { parsed = JSON.parse(value.value); } catch (error) { return toast(`新值不是有效的 JSON：${error.message}`); }
    return change({ type: 'decide', item: item.item, action: 'edit', value: parsed });
  };
  const where = item.path === undefined ? '整份文件' : item.path;
  return h('div', { class: `card${decision ? ' done' : ''}` },
    h('div', { class: 'card-head' }, h('strong', {}, `#${item.item}`), h('span', { class: 'chip warn' }, item.reasonName),
      h('span', { class: 'mono' }, `${item.file} · ${where}`), locateLink(item.location, `待确认项 #${item.item}`),
      h('span', { class: `chip ${decision ? 'ok' : ''}` }, decision ? `已处理：${ACTIONS[decision.action]}` : '未处理')),
    h('p', { class: 'notes', style: 'margin:6px 0' }, item.note),
    item.candidate !== undefined ? h('div', {}, h('span', { class: 'muted' }, '候选值'), h('pre', {}, json(item.candidate))) : null,
    h('details', {}, h('summary', {}, '候选文件中的当前写法'), h('pre', {}, item.current === undefined ? '（没有值）' : json(item.current))),
    h('div', { class: 'choices' }, radio('adopt'), radio('edit'), radio('empty')),
    value,
    h('div', { class: 'row' }, h('button', { class: 'primary', disabled: !editable, onclick: save }, '保存处理'),
      decision ? h('button', { disabled: !editable, onclick: () => change({ type: 'undecide', item: item.item }) }, '清除处理') : null));
}

const stateChip = (state) => state === 'edited' ? h('span', { class: 'chip accent' }, '改过') : state === 'removed' ? h('span', { class: 'chip bad' }, '已删去') : null;
const pendingChips = (numbers) => numbers.length ? numbers.map((n) => h('span', { class: 'chip warn' }, `#${n}`)) : '';
const rowClass = (item) => item.state !== 'kept' ? item.state : item.pending.length ? 'pending' : '';
const short = (value) => { const text = typeof value === 'string' ? value : JSON.stringify(value); return text.length > 120 ? `${text.slice(0, 120)}…` : text; };

function candidateSection(candidate) {
  const label = candidate.name ?? candidate.path;
  const tags = [
    h('span', { class: 'chip' }, KINDS[candidate.kind]),
    candidate.published ? h('span', { class: 'chip ok' }, `将发布为 ${candidate.published.name} v${candidate.published.version}（按快照）`) : null,
    candidate.dropped ? h('span', { class: 'chip bad' }, '标为空，不写入') : null,
    candidate.edited ? h('span', { class: 'chip accent' }, '整份改过') : null,
  ];
  const body = candidate.kind === 'definition' ? definitionBody(candidate) : candidate.kind === 'dataset' ? datasetBody(candidate) : templateBody(candidate);
  return h('section', {},
    h('div', { class: 'card-head' }, h('h2', { style: 'margin:0' }, label), candidate.displayName ? h('span', { class: 'muted' }, candidate.displayName) : null,
      h('span', { class: 'mono muted' }, candidate.path), ...tags, locateLink(candidate.location, label)),
    candidate.description ? h('p', { class: 'muted' }, candidate.description) : null,
    body,
    candidate.problems.length ? [h('h3', { style: 'margin-top:12px' }, '引擎校验问题'), problemList(candidate.problems)] : null);
}

function definitionBody(candidate) {
  const rows = candidate.fields.map((field) => h('tr', { class: rowClass(field) },
    h('td', {}, h('div', { class: 'mono' }, field.name), field.displayName ? h('div', {}, field.displayName) : null, stateChip(field.state)),
    h('td', { class: 'mono' }, field.type),
    h('td', {}, field.constraints.length ? field.constraints.join('；') : h('span', { class: 'muted' }, '无')),
    h('td', {}, field.location ? [field.location.where, ' ', locateLink(field.location, `${candidate.name ?? candidate.path} · ${field.name}`)] : h('span', { class: 'muted' }, '未标注'),
      field.description ? h('div', { class: 'muted' }, field.description) : null),
    h('td', {}, pendingChips(field.pending))));
  const compiled = candidate.compiled;
  return [
    h('table', {}, h('thead', {}, h('tr', {}, ['字段', '类型', '约束', '图上位置 / 说明', '待确认'].map((text) => h('th', {}, text)))), h('tbody', {}, rows)),
    h('h3', { style: 'margin-top:12px' }, '编译产物摘要'),
    compiled ? h('div', {},
      h('p', { style: 'margin:4px 0' }, `${compiled.title ?? ''}：属性 ${compiled.properties} 个；必填 ${compiled.required.length ? compiled.required.join('、') : '无'}。`),
      h('details', {}, h('summary', {}, '查看完整 JSON Schema'), h('pre', {}, json(compiled.schema))))
      : h('p', { class: 'muted' }, candidate.dropped ? '不发布。' : '未能编译，见下方问题。'),
  ];
}

function datasetBody(candidate) {
  const entries = candidate.entries ?? [];
  const rows = entries.map((entry) => h('tr', { class: rowClass(entry) },
    h('td', { class: 'mono' }, entry.path, ' ', stateChip(entry.state)),
    h('td', {}, short(entry.value)),
    h('td', {}, entry.location ? [entry.location.where, ' ', locateLink(entry.location, `${candidate.name ?? candidate.path} · ${entry.path}`)] : ''),
    h('td', {}, pendingChips(entry.pending))));
  return [
    candidate.staticSchema ? h('p', { style: 'margin:4px 0' }, `选定的数据定义：${candidate.staticSchema.name} v${candidate.staticSchema.version}；共 ${entries.length} 个值。`) : null,
    h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, ['字段路径', '值', '图上位置', '待确认'].map((text) => h('th', {}, text)))), h('tbody', {}, rows))),
    h('details', {}, h('summary', {}, '查看完整数据集'), h('pre', {}, json(candidate.document ?? null))),
  ];
}

const CHANGES = { added: '新增', removed: '删去', changed: '修改' };

/** 模板辅助修改：工作副本相对已保存模板的结构化差异。 */
function revisionBody(candidate) {
  const revision = candidate.revision;
  if (!revision) return null;
  if (revision.status === 'added') return h('p', {}, h('span', { class: 'chip accent' }, '新增的模板'), ' 应用时作为新文件保存。');
  if (revision.status === 'unchanged') return h('p', {}, h('span', { class: 'chip' }, '与已保存的模板相同'), ' 应用时不写入。');
  const value = (item) => item === undefined ? h('span', { class: 'muted' }, '（无）') : h('code', {}, short(item));
  const rows = revision.changes.flatMap((change) => {
    const head = h('td', { class: 'mono' }, change.path, ' ', h('span', { class: `chip ${change.change === 'removed' ? 'bad' : 'accent'}` }, CHANGES[change.change]));
    if (!change.properties) {
      return [h('tr', {}, head, h('td', {}, change.target === 'element' ? '整个元素' : '整个键'), h('td', {}, value(change.before)), h('td', {}, value(change.after)))];
    }
    return change.properties.map((property, index) => h('tr', {},
      index === 0 ? head : h('td', {}), h('td', { class: 'mono' }, property.key), h('td', {}, value(property.before)), h('td', {}, value(property.after))));
  });
  return [
    h('h3', { style: 'margin-top:4px' }, `相对已保存模板的改动（${revision.changes.length} 处，基于 ${revision.basis?.file ?? '?'}）`),
    h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, ['位置', '属性', '修改前', '修改后'].map((text) => h('th', {}, text)))), h('tbody', {}, rows))),
    h('details', {}, h('summary', {}, '查看完整差异（JSON）'), h('pre', {}, json(revision.changes))),
  ];
}

function templateBody(candidate) {
  const template = candidate.template ?? { parameters: [] };
  const elements = candidate.elements ?? [];
  const rows = elements.map((element) => h('tr', { class: rowClass(element) },
    h('td', { class: 'mono' }, element.path, ' ', stateChip(element.state)),
    h('td', { class: 'mono' }, element.type),
    h('td', {}, element.location ? [element.location.where, ' ', locateLink(element.location, element.path)] : ''),
    h('td', {}, pendingChips(element.pending))));
  const parameters = template.parameters.map((p) => `${p.name}${p.displayName ? `（${p.displayName}）` : ''}${p.type ? ` ${p.type}` : ''}${p.visibility ? ` ${p.visibility}` : ''}`);
  return [
    revisionBody(candidate),
    h('p', { style: 'margin:4px 0' }, `基准：${template.base ? `${template.base.name} v${template.base.version}` : '未知'}；参数：${parameters.length ? parameters.join('、') : '无'}；元素 ${elements.filter((e) => e.state !== 'removed').length} 个。`),
    h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, ['元素路径', '类型', '图上位置', '待确认'].map((text) => h('th', {}, text)))), h('tbody', {}, rows))),
    h('details', {}, h('summary', {}, '查看完整模板'), h('pre', {}, json(candidate.document ?? null))),
  ];
}

function notesSection() {
  const usage = view.round.usage ?? {};
  const minutes = usage.wallMs ? `${(usage.wallMs / 60000).toFixed(1)} 分钟` : '未知';
  return h('section', {}, h('h2', {}, 'Agent 的说明'), h('div', { class: 'notes' }, view.round.notes),
    h('p', { class: 'muted', style: 'margin-bottom:0' }, `用时 ${minutes}，${usage.turns ?? '?'} 轮，输出 ${usage.outputTokens ?? '?'} tokens，模型 ${usage.servedModel ?? '未知'}。`));
}

load().catch((error) => toast(`读取失败：${error.message}`));
</script>
</body>
</html>
